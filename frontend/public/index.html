<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetraChat</title>
  <meta name="description" content="Conversational image recognition chatbot">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><ellipse cx='16' cy='16' rx='14' ry='9' fill='%232f6fdf'/><circle cx='16' cy='16' r='5' fill='white'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M2 16c3.5-6 8.5-9 14-9s10.5 3 14 9c-3.5 6-8.5 9-14 9S5.5 22 2 16z" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <circle cx="16" cy="16" r="4.6" fill="currentColor"/>
      </svg>
      <div>
        <h1>NetraChat</h1>
        <p class="tagline">Conversational image recognition chatbot</p>
      </div>
    </div>
    <div class="status" id="status" role="status">
      <span class="dot"></span><span id="status-text">Connecting…</span>
    </div>
  </header>

  <main class="layout">
    <!-- Left: the image and what was detected -->
    <section class="panel vision" aria-label="Image">
      <div class="panel-head">
        <h2>Image</h2>
        <div class="toggle" id="box-toggle-wrap" hidden>
          <label><input type="checkbox" id="box-toggle" checked> Show boxes</label>
        </div>
      </div>

      <label class="dropzone" id="dropzone" for="file-input">
        <input type="file" id="file-input" accept="image/*" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <strong>Drop an image here</strong>
        <span>or click to choose a photo (JPG or PNG, up to 15 MB)</span>
      </label>

      <div class="stage" id="stage" hidden>
        <div class="frame" id="frame">
          <img id="preview" alt="Uploaded image">
          <div class="boxes" id="boxes"></div>
          <div class="scanning" id="scanning" hidden><span>Analysing image…</span></div>
        </div>
        <div class="objects-head">
          <h3>Detected objects</h3>
          <button class="ghost" id="change-image" type="button">Change image</button>
        </div>
        <ul class="objects" id="objects"></ul>
      </div>
    </section>

    <!-- Right: the conversation -->
    <section class="panel chat" aria-label="Chat">
      <div class="panel-head">
        <h2>Chat</h2>
        <button class="ghost" id="reset" type="button">Start over</button>
      </div>
      <div class="messages" id="messages" aria-live="polite"></div>
      <div class="suggestions" id="suggestions"></div>
      <form class="composer" id="composer" autocomplete="off">
        <input id="message" type="text" maxlength="500"
               placeholder="Ask about the image…" aria-label="Your message">
        <button type="submit" id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z" fill="currentColor"/></svg>
        </button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
